{% extends "base.html" %}
{% block content %}
<div class="form-card wide">
    {% if expense %}
        <h2>Edit Expense</h2>
        <form method="POST">
    {% else %}
        <h2>Add Expense</h2>
        <form method="POST">
    {% endif %}
        <label>Date</label>
        <input type="date" name="expense_date"
               value="{{ expense.expense_date if expense else '' }}" required>

        <label>Category</label>
        <select name="category_id" required>
            {% for category in categories %}
                <option value="{{ category.category_id }}"
                    {% if expense and expense.category_id == category.category_id %}selected{% endif %}>
                    {{ category.category_name }}
                </option>
            {% endfor %}
        </select>

        <label>Amount (₹)</label>
        <input type="number" name="amount" min="0.01" step="0.01"
               value="{{ expense.amount if expense else '' }}" required>

        <label>Description</label>
        <input type="text" name="description"
               value="{{ expense.description if expense else '' }}">

        <label>Payment method</label>
        <select name="payment_method">
            {% for method in ['UPI', 'Cash', 'Debit Card', 'Credit Card', 'Bank Transfer', 'Other'] %}
                <option value="{{ method }}"
                    {% if expense and expense.payment_method == method %}selected{% endif %}>
                    {{ method }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Save Expense</button>
    </form>
    <p><a href="{{ url_for('dashboard') }}">Back to dashboard</a></p>
</div>
{% endblock %}
